server {
    listen 80;
    server_name _;

    # Gate probe: anything that reaches this returns 200.
    location = /ok {
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Serve the shared config so a new iPad can be set up by typing one URL
    # in Parent settings > "Fetch config from URL".
    location = /fort.json {
        add_header Cache-Control "no-store";
        default_type application/json;
        root /usr/share/nginx/html;
    }

    location / { return 404; }
}
