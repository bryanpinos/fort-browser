# Fort Parent: the parents' console (https://parent.example.com via Caddy).
# .env (mode 600, never committed) holds OWUI_KEY (Fort Chat admin API key)
# and KIDS (JSON list: id, name, device, chat_user).
services:
  parent:
    build: .
    image: fort-parent:local
    container_name: fort-parent
    restart: unless-stopped
    ports:
      - "8094:8080"
    env_file: .env
    environment:
      RP_ID: parent.example.com
      ORIGIN: https://parent.example.com
      REVIEW_DB: /review/review.db
      OWUI_URL: http://192.168.1.20:3001
    volumes:
      - ./data:/data
      - /volume1/docker/fort-relay/review:/review   # read only in code (SQLite WAL needs the dir writable)
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    pids_limit: 64
    labels:
      - com.centurylinklabs.watchtower.enable=false   # locally built
