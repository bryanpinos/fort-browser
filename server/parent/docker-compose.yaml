# Fort Parent: the parents' console. Guide: docs/parent-console.md.
# .env (mode 600, never committed; see .env.example): RP_ID, ORIGIN, paths to
# the relay's review/config folders, KIDS, and optionally OWUI_URL + OWUI_KEY.
services:
  parent:
    build: .
    image: fort-parent:local
    container_name: fort-parent
    restart: unless-stopped
    ports:
      - "${PARENT_PORT:-8094}:8080"
    env_file: .env
    environment:
      REVIEW_DB: /review/review.db
    volumes:
      - ./data:/data
      - ${RELAY_DIR:?set RELAY_DIR (the relay stack folder)}/review:/review   # read only in code (SQLite WAL needs the dir writable)
      - ${RELAY_DIR}/config:/homeconfig   # home config the relay serves to the iPads
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    pids_limit: 64
    labels:
      - com.centurylinklabs.watchtower.enable=false   # locally built
