<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fort Parent setup</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="center card"><h1>⛺ Add a passkey</h1><p class="muted">This one-time link adds a passkey for Fort Parent. It's saved in your iCloud Keychain, so your other Apple devices can sign in too.</p>
<p><input id="name" placeholder="Name it, e.g. Bryan's iPhone" style="font:inherit;padding:8px;width:100%;border-radius:8px;border:1px solid var(--line)"></p>
<button class="primary" id="go">Create passkey</button><p class="err" id="err"></p></div>
<script src="/auth.js"></script><script src="/setup.js"></script></body></html>
