# Home-side services for Fort. Run on the NAS (or any box on your tailnet).
# The iPad reaches these over Tailscale at the host's 100.x.y.z address, so
# they're unreachable from anywhere else without binding to a public interface.
#
#   probe:  answers 200 on /ok. Point GateConfig.probeURL at http://<tailnet-ip>:8088/ok
#   proxy:  HTTP CONNECT proxy. Point GateConfig.proxy at { "kind": "http", "host": "<tailnet-ip>", "port": 3128 }
#           All page traffic then exits your UCG-Fiber, so its content filter / DNS rules apply.
#   logs:   optional tiny collector; point GateConfig.logEndpoint at http://<tailnet-ip>:8089/log
#
# Bind to the Tailscale interface IP explicitly if the host also has a LAN
# address you don't want to expose (replace 0.0.0.0 below with 100.x.y.z).

services:
  probe:
    image: nginx:alpine
    container_name: fort-probe
    restart: unless-stopped
    ports:
      - "0.0.0.0:8088:80"
    volumes:
      - ./probe/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./probe/fort.json:/usr/share/nginx/html/fort.json:ro

  proxy:
    image: ubuntu/squid:latest
    container_name: fort-proxy
    restart: unless-stopped
    ports:
      - "0.0.0.0:3128:3128"
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro

  logs:
    build: ./logs
    container_name: fort-logs
    restart: unless-stopped
    ports:
      - "0.0.0.0:8089:8089"
    volumes:
      - ./logs/data:/data
