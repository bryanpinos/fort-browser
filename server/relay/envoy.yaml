# Fort relay: Apple network relay (HTTP/2 CONNECT over TLS) for the
# Fort browser. The app pins all WKWebView traffic here via
# ProxyConfiguration(relayHops:) and sends the token as x-fort-token.
#
# Mutual TLS: the handshake requires a client cert signed by the Fort client CA
# whose URI SAN is on the allowlist in clients/clients.yaml (an SDS file Envoy
# watches, so revoking a device is an edit + atomic rename, no restart). Clients
# without one never reach the HTTP layer. The token is a second check.
#
# Route order matters:
#   1. wrong/missing token          -> 407
#   2. private / internal targets   -> 403 (a leaked token must not reach the LAN)
#   3. ports 80/443                 -> tunneled via the dynamic forward proxy
#   4. any other CONNECT            -> 403
# The authority deny-list can't see what a public name resolves to, so a name
# pointing at a private IP gets through. Before exposing this to the internet,
# also isolate the relay's egress at the network layer (own VLAN + firewall).
#
# CHANGE_ME_TOKEN is replaced at deploy time; never commit the real token.

# Envoy requires a node identity to use file-based SDS (clients.yaml).
node: {id: fort-relay, cluster: fort-relay}

# The private/internal deny-list regex compiles to ~145 RE2 instructions;
# Envoy's default ceiling is 100.
layered_runtime:
  layers:
  - name: static
    static_layer:
      re2.max_program_size.error_level: 1000

overload_manager:
  resource_monitors:
  - name: envoy.resource_monitors.global_downstream_max_connections
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
      max_active_downstream_connections: 512

static_resources:
  listeners:
  - name: relay
    address: {socket_address: {address: 0.0.0.0, port_value: 8443}}
    per_connection_buffer_limit_bytes: 32768
    filter_chains:
    - transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          require_client_certificate: true
          common_tls_context:
            alpn_protocols: [h2]
            tls_params: {tls_minimum_protocol_version: TLSv1_2}
            validation_context_sds_secret_config:
              name: fort_clients
              sds_config:
                path_config_source:
                  path: /etc/envoy/clients/clients.yaml
                  watched_directory: {path: /etc/envoy/clients}
            tls_certificates:
            - certificate_chain: {filename: /certs/relay.crt}
              private_key: {filename: /certs/relay.key}
              watched_directory: {path: /certs}
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: relay
          codec_type: HTTP2
          http2_protocol_options:
            allow_connect: true
            max_concurrent_streams: 100
          common_http_protocol_options: {idle_timeout: 300s}
          stream_idle_timeout: 300s
          request_headers_timeout: 10s
          server_header_transformation: PASS_THROUGH
          upgrade_configs: [{upgrade_type: CONNECT}]
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                text_format_source:
                  inline_string: "%START_TIME% %DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT% peer=%DOWNSTREAM_PEER_URI_SAN% %REQ(:METHOD)% %REQ(:AUTHORITY)% %RESPONSE_CODE% %RESPONSE_FLAGS% up=%UPSTREAM_HOST% rx=%BYTES_RECEIVED% tx=%BYTES_SENT% dur=%DURATION%\n"
          route_config:
            virtual_hosts:
            - name: relay
              domains: ["*"]
              routes:
              - match:
                  connect_matcher: {}
                  headers:
                  - name: x-fort-token
                    string_match: {exact: "CHANGE_ME_TOKEN"}
                    invert_match: true
                    treat_missing_header_as_empty: true
                direct_response: {status: 407}
              - match:
                  connect_matcher: {}
                  headers:
                  - name: ":authority"
                    string_match:
                      safe_regex:
                        regex: "^(\\[.*\\]|(0|10|127)\\.[0-9.]+|192\\.168\\.[0-9.]+|172\\.(1[6-9]|2[0-9]|3[01])\\.[0-9.]+|169\\.254\\.[0-9.]+|100\\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\\.[0-9.]+|[^.:]+|(.*\\.)?(pinos\\.dev|local|lan|internal|home\\.arpa|localhost|ts\\.net)\\.?):[0-9]+$"
                direct_response: {status: 403}
              - match:
                  connect_matcher: {}
                  headers:
                  - name: ":authority"
                    string_match: {safe_regex: {regex: ".*:(80|443)$"}}
                route:
                  cluster: dfp
                  upgrade_configs: [{upgrade_type: CONNECT, connect_config: {}}]
              - match: {connect_matcher: {}}
                direct_response: {status: 403}
              - match: {prefix: "/"}
                direct_response: {status: 404}
          http_filters:
          - name: envoy.filters.http.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
              dns_cache_config: {name: dfp_cache, dns_lookup_family: V4_PREFERRED, max_hosts: 4096}
          - name: envoy.filters.http.router
            typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}

  clusters:
  - name: dfp
    connect_timeout: 5s
    lb_policy: CLUSTER_PROVIDED
    cluster_type:
      name: envoy.clusters.dynamic_forward_proxy
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
        dns_cache_config: {name: dfp_cache, dns_lookup_family: V4_PREFERRED, max_hosts: 4096}
