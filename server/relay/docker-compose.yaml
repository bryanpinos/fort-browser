# Fort relay stack. Deployed at /volume1/docker/fort-relay on the NAS.
#   relay-cert  lego: issues/renews relay.example.com via Route 53 DNS-01
#   relay       Envoy (distroless, non-root): the relay itself on :8443
# .env holds LEGO_EMAIL, AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION /
# AWS_HOSTED_ZONE_ID for lego only; the token lives in envoy.yaml.
services:
  relay-cert:
    image: goacme/lego:latest
    container_name: fort-relay-cert
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "/renew.sh"]
    volumes:
      - ./renew.sh:/renew.sh:ro
      - ./lego:/data
      - ./certs:/out
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]

  relay:
    image: envoyproxy/envoy:distroless-v1.40-latest
    container_name: fort-relay
    restart: unless-stopped
    command: ["-c", "/etc/envoy/envoy.yaml", "--disable-hot-restart", "--log-level", "warn"]
    ports:
      - "8443:8443"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./certs:/certs:ro
      - ./ca:/ca:ro                      # fort-ca.crt (public)
      - ./clients:/etc/envoy/clients:ro  # clients.yaml: device allowlist
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 256
    depends_on: [relay-cert]

  # Dynamic DNS: keeps relay.example.com -> this home's public IPv4 (Route 53,
  # that record only, only on change). Same AWS credentials as lego (.env).
  ddns:
    image: amazon/aws-cli:latest
    container_name: fort-relay-ddns
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/bash", "/ddns.sh"]
    volumes:
      - ./ddns.sh:/ddns.sh:ro
    read_only: true
    tmpfs: [/tmp, /root/.aws]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  # Envoy stats + cert expiry -> Home Assistant (MQTT discovery). Shares the
  # relay's network namespace to reach its loopback-only admin API.
  monitor:
    image: python:3.12-alpine
    container_name: fort-relay-monitor
    restart: unless-stopped
    network_mode: "service:relay"
    depends_on: [relay]
    command: ["python", "-u", "/monitor.py"]
    environment:
      MQTT_HOST: 192.168.1.10
      MQTT_PORT: "1883"
    volumes:
      - ./monitor.py:/monitor.py:ro
      - ./certs:/certs:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 32

# Pinned: the NAS's net-shim drops anything from this subnet to the LAN,
# tailnet and the host (see net-shim-reassert.sh, "fort_relay" table).
networks:
  default:
    ipam:
      config:
        - subnet: 172.22.0.0/16
