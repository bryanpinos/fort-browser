# Fort relay stack. Deployed at /volume1/docker/fort-relay on the NAS.
#   relay-cert  lego: issues/renews relay.example.com via Route 53 DNS-01
#   relay       Envoy (distroless, non-root): the relay itself on :8443
# .env holds LEGO_EMAIL, AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION /
# AWS_HOSTED_ZONE_ID for lego only; the token lives in envoy.yaml.
services:
  relay-cert:
    image: goacme/lego:latest
    container_name: fort-relay-cert
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "/renew.sh"]
    volumes:
      - ./renew.sh:/renew.sh:ro
      - ./lego:/data
      - ./certs:/out
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]

  relay:
    image: envoyproxy/envoy:distroless-v1.40-latest
    container_name: fort-relay
    restart: unless-stopped
    command: ["-c", "/etc/envoy/envoy.yaml", "--disable-hot-restart", "--log-level", "warn"]
    # Own address on the Fort VLAN (40): the UCG applies the Kids content
    # filter, SafeSearch, ad blocking and IPS to this source, and its firewall
    # isolates the VLAN from the LAN. The WAN port forward targets this IP.
    networks:
      fort_vlan:
        ipv4_address: 192.168.40.10
        # Fixed (locally administered) MAC so UniFi sees one stable client;
        # docker otherwise picks a new random MAC on every recreate.
        mac_address: "02:46:6f:72:74:0a"
    dns: [192.168.40.1]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./certs:/certs:ro
      - ./ca:/ca:ro                      # fort-ca.crt (public)
      - ./clients:/etc/envoy/clients:ro  # clients.yaml: device allowlist
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 256
    depends_on: [relay-cert]

  # Dynamic DNS: keeps relay.example.com -> this home's public IPv4 (Route 53,
  # that record only, only on change). Same AWS credentials as lego (.env).
  ddns:
    image: amazon/aws-cli:latest
    container_name: fort-relay-ddns
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/bash", "/ddns.sh"]
    volumes:
      - ./ddns.sh:/ddns.sh:ro
    read_only: true
    tmpfs: [/tmp, /root/.aws]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  # Envoy stats + cert expiry -> Home Assistant (MQTT discovery). Shares the
  # relay's network namespace to reach its loopback-only admin API.
  monitor:
    image: python:3.12-alpine
    container_name: fort-relay-monitor
    restart: unless-stopped
    network_mode: "service:relay"
    depends_on: [relay]
    command: ["python", "-u", "/monitor.py"]
    environment:
      MQTT_HOST: 192.168.1.10
      MQTT_PORT: "1883"
    volumes:
      - ./monitor.py:/monitor.py:ro
      - ./certs:/certs:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 32

  # Page review. ingest shares the relay's network namespace (loopback only,
  # reachable just from Envoy); worker sits on an ordinary network to reach
  # LM Studio and MQTT. They share nothing but ./review (the SQLite queue).
  ingest:
    image: python:3.12-alpine
    container_name: fort-relay-ingest
    restart: unless-stopped
    network_mode: "service:relay"
    depends_on: [relay]
    user: "1000:10"
    command: ["python", "-u", "/ingest.py"]
    volumes:
      - ./ingest.py:/ingest.py:ro
      - ./review:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 32

  worker:
    image: python:3.12-alpine
    container_name: fort-review-worker
    restart: unless-stopped
    networks: [lan]
    user: "1000:10"
    command: ["python", "-u", "/worker.py"]
    environment:
      LLM_URL: http://192.168.1.20:1234/v1/chat/completions
      LLM_MODEL: gemma-4-31b-it
      MQTT_HOST: 192.168.1.10
      SUMMARY_AT: "19:30"
      RETENTION_DAYS: "30"
    volumes:
      - ./worker.py:/worker.py:ro
      - ./review:/data
      - /etc/localtime:/etc/localtime:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 32

# The relay itself is on the Fort VLAN (isolated by the UCG firewall). The
# bridge network below still hosts relay-cert and ddns; it stays pinned so the
# NAS's net-shim "fort_relay" table keeps them off the LAN too.
networks:
  default:
    ipam:
      config:
        - subnet: 172.22.0.0/16
  lan: {}
  # Macvlan on VLAN 40 (docker creates eth0.40). The NAS's switch port carries
  # all VLANs tagged. Like Caddy's macvlan, the NAS host itself can't reach
  # this address directly; everything goes through the UCG.
  fort_vlan:
    driver: macvlan
    driver_opts:
      parent: eth0.40
    ipam:
      config:
        - subnet: 192.168.40.0/24
          gateway: 192.168.40.1
          ip_range: 192.168.40.8/29
