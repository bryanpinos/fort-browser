# Minimal reproduction app. Run server/make-certs.sh first, then `xcodegen generate`.
name: RelayClientCertRepro
options:
  bundleIdPrefix: dev.pinos.repro
  deploymentTarget: {iOS: "17.0"}
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  RelayClientCertRepro:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: RelayRepro
