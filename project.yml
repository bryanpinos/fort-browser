# XcodeGen spec. Run `xcodegen generate` to produce Fort.xcodeproj.
# https://github.com/yonaskolb/XcodeGen
name: Fort
options:
  bundleIdPrefix: dev.pinos          # change to your reverse-DNS prefix
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""              # set in Xcode > Signing & Capabilities, or here
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "2"       # iPad only (iPhone can be added in a later update)
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Fort:
    type: application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pinos.fort
        # Here, not only in the project settings: XcodeGen's app-target defaults
        # override those with "1,2" (iPhone + iPad).
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    platform: iOS
    sources:
      - Sources
      - path: Resources
        optional: true
    # XcodeGen rewrites Fort.entitlements from these properties on every
    # generate, so entitlements live here, not in the file.
    entitlements:
      path: Fort.entitlements
      properties:
        # Default browser: granted by Apple 2026-11-16 (request 2U7T7NM6PD) and
        # enabled on the dev.pinos.fort App ID.
        com.apple.developer.web-browser: true
    scheme:
      testTargets:
        - GateConfigTests
        - FortUITests
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Fort
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "8"
        # Only standard HTTPS/TLS: exempt, so uploads skip the export question.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        # Lets AirDrop / Files offer "Open in Fort" for relay certificates
        # instead of only the system profile installer.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Fort relay certificate
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.rsa.pkcs-12]
        LSSupportsOpeningDocumentsInPlace: false
        # Only when a child chooses to take a photo for a website (e.g. Fort Chat).
        NSCameraUsageDescription: Fort uses the camera only when you choose to take a photo to share with a website, like showing Fort Chat a rock you found.
        NSLocalNetworkUsageDescription: Fort checks that this device can reach your home network before allowing browsing.
        LSApplicationQueriesSchemes:
          - tailscale
        # Lets the app be offered as a handler for links (needed later for the
        # default-browser entitlement; harmless now).
        CFBundleURLTypes:
          - CFBundleURLName: web
            CFBundleURLSchemes: [http, https]
          # fort://open?url=pbskids.org, for a Home Screen icon made in Shortcuts.
          - CFBundleURLName: fort
            CFBundleURLSchemes: [fort]
        NSAppTransportSecurity:
          # Probe/proxy/log endpoints on the tailnet are usually plain http.
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true

  GateConfigTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/GateConfigTests
    dependencies:
      - target: Fort
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  FortUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/FortUITests
    dependencies:
      - target: Fort
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
