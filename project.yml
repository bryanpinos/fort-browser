# XcodeGen spec. Run `xcodegen generate` to produce Fort.xcodeproj.
# https://github.com/yonaskolb/XcodeGen
name: Fort
options:
  bundleIdPrefix: dev.pinos          # change to your reverse-DNS prefix
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""              # set in Xcode > Signing & Capabilities, or here
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"     # iPhone + iPad
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Fort:
    type: application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pinos.fort
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    platform: iOS
    sources:
      - Sources
      - path: Resources
        optional: true
    entitlements:
      path: Fort.entitlements
    scheme:
      testTargets:
        - GateConfigTests
        - FortUITests
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Fort
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        # Lets AirDrop / Files offer "Open in Fort" for relay certificates
        # instead of only the system profile installer.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Fort relay certificate
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.rsa.pkcs-12]
        LSSupportsOpeningDocumentsInPlace: false
        NSLocalNetworkUsageDescription: Fort checks that this device can reach your home network before allowing browsing.
        LSApplicationQueriesSchemes:
          - tailscale
        # Lets the app be offered as a handler for links (needed later for the
        # default-browser entitlement; harmless now).
        CFBundleURLTypes:
          - CFBundleURLName: web
            CFBundleURLSchemes: [http, https]
        NSAppTransportSecurity:
          # Probe/proxy/log endpoints on the tailnet are usually plain http.
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true

  GateConfigTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/GateConfigTests
    dependencies:
      - target: Fort
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  FortUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/FortUITests
    dependencies:
      - target: Fort
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
