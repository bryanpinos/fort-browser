# XcodeGen spec. Run `xcodegen generate` to produce Hearth.xcodeproj.
# https://github.com/yonaskolb/XcodeGen
name: Hearth
options:
  bundleIdPrefix: dev.pinos          # change to your reverse-DNS prefix
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""              # set in Xcode > Signing & Capabilities, or here
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"     # iPhone + iPad
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Hearth:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        optional: true
    entitlements:
      path: Hearth.entitlements
    scheme:
      testTargets:
        - GateConfigTests
        - HearthUITests
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Hearth
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        NSLocalNetworkUsageDescription: Hearth checks that this device can reach your home network before allowing browsing.
        LSApplicationQueriesSchemes:
          - tailscale
        # Lets the app be offered as a handler for links (needed later for the
        # default-browser entitlement; harmless now).
        CFBundleURLTypes:
          - CFBundleURLName: web
            CFBundleURLSchemes: [http, https]
        NSAppTransportSecurity:
          # Probe/proxy/log endpoints on the tailnet are usually plain http.
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true

  GateConfigTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/GateConfigTests
    dependencies:
      - target: Hearth
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  HearthUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/HearthUITests
    dependencies:
      - target: Hearth
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
